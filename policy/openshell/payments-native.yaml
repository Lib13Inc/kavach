# Generated by `kavach openshell compile --mode native` from policy/payments.yaml.
# Do not edit; change the Kavach pack and recompile.
version: 1
filesystem_policy:
  include_workdir: true
  read_only:
  - /usr
  - /lib
  - /lib64
  - /etc
  read_write:
  - /tmp
  - /trace
landlock:
  compatibility: hard_requirement
network_policies:
  api_anthropic_com:
    name: api.anthropic.com
    endpoints:
    - host: api.anthropic.com
      port: 443
      protocol: rest
      enforcement: enforce
      access: read-write
      credential_binding:
        provider: anthropic_api_key
    binaries:
    - path: /usr/local/bin/python3.12
  api_inference_crusoecloud_com:
    name: api.inference.crusoecloud.com
    endpoints:
    - host: api.inference.crusoecloud.com
      port: 443
      protocol: rest
      enforcement: enforce
      access: read-write
      credential_binding:
        provider: crusoe_api_key
    binaries:
    - path: /usr/local/bin/python3.12
  api_openai_com:
    name: api.openai.com
    endpoints:
    - host: api.openai.com
      port: 443
      protocol: rest
      enforcement: enforce
      access: read-write
      credential_binding:
        provider: openai_api_key
    binaries:
    - path: /usr/local/bin/python3.12
  api_z_ai:
    name: api.z.ai
    endpoints:
    - host: api.z.ai
      port: 443
      protocol: rest
      enforcement: enforce
      access: read-write
      credential_binding:
        provider: openai_api_key
    binaries:
    - path: /usr/local/bin/python3.12
  open_bigmodel_cn:
    name: open.bigmodel.cn
    endpoints:
    - host: open.bigmodel.cn
      port: 443
      protocol: rest
      enforcement: enforce
      access: read-write
      credential_binding:
        provider: openai_api_key
    binaries:
    - path: /usr/local/bin/python3.12
  openrouter_ai:
    name: openrouter.ai
    endpoints:
    - host: openrouter.ai
      port: 443
      protocol: rest
      enforcement: enforce
      access: read-write
      credential_binding:
        provider: openrouter_api_key
    binaries:
    - path: /usr/local/bin/python3.12
  payments_internal:
    name: payments.internal
    endpoints:
    - host: payments.internal
      port: 80
      protocol: rest
      enforcement: enforce
      access: read-write
    binaries:
    - path: /usr/local/bin/python3.12
  tickets_internal:
    name: tickets.internal
    endpoints:
    - host: tickets.internal
      port: 80
      protocol: rest
      enforcement: enforce
      access: read-write
    binaries:
    - path: /usr/local/bin/python3.12
network_middlewares:
  kavach_vault:
    middleware: kavach-vault
    order: 10
    on_error: fail_closed
    endpoints:
      include:
      - api.anthropic.com
      - api.inference.crusoecloud.com
      - api.openai.com
      - api.z.ai
      - open.bigmodel.cn
      - openrouter.ai
      - tickets.internal
