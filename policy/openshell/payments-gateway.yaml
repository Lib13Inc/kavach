# Generated by `kavach openshell compile --mode gateway` from policy/payments.yaml.
# Do not edit; change the Kavach pack and recompile.
version: 1
filesystem_policy:
  include_workdir: true
  read_only:
  - /usr
  - /lib
  - /lib64
  - /etc
  read_write:
  - /tmp
  - /trace
landlock:
  compatibility: hard_requirement
network_policies:
  kavach_gateway:
    name: Kavach gateway (the only way out)
    endpoints:
    - host: host.openshell.internal
      port: 8080
      protocol: tcp
      tls: skip
    binaries:
    - path: /usr/local/bin/python3.12
